general.import = ["~/.config/alacritty/themes/tokyonight.toml"]

[font]
size = 16.0

[font.offset]
x = 0
y = 0

[font.normal]
family = "Maple Mono NF Thin"
style = "Regular"

[font.bold]
family = "Maple Mono NF Thin"
style = "Bold"

[font.italic]
family = "Maple Mono NF Thin"
style = "Italic"

[font.bold_italic]
family = "Maple Mono NF Thin"
style = "Bold Italic"

[window]
startup_mode = "Maximized"
opacity = 0.98
blur = false

[cursor]
style = { shape = "Underline", blinking = "Off"  }
thickness = 0.3

[colors.cursor]
text = "CellForeground"  # Texte du curseur (par défaut: couleur de la cellule)
cursor = "#bb9af7"  
