# THEME
include tabs.conf
#include current-theme.conf
include ~/.local/state/omarchy/current/theme/kitty.conf

# VISUAL
background_opacity 0.95
cursor_shape block
confirm_os_window_close 0
enable_audio_bell no
hide_window_decorations yes
mouse_hide_wait -1.0
enabled_layouts fat:bias=70;full_size=1;mirrored=false
cursor_trail 2

# LATENCY
input_delay 2
repaint_delay 8
sync_to_monitor no
wayland_enable_ime no

# SCROLL
scrollback_lines 10000
scrollbar hovered
scrollbar_width 1.5

# FONT
font_size 11
font_family      family='Maple Mono NF' style=Thin
bold_font        auto
italic_font      auto
bold_italic_font auto
text_composition_strategy legacy
modify_font underline_thickness 150%
modify_font strikethrough_thickness 150%
modify_font cell_height -1px
box_drawing_scale 0.001, 1, 1.5, 2

# BINDINGS
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab
map ctrl+t no_op
map ctrl+q no_op

# VARIOUS
shell_integration no-title no-cursor no-rc
allow_remote_control no 

