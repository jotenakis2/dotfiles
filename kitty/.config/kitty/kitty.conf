# THEME
include ~/.local/state/omarchy/current/theme/kitty.conf
include tabs.conf

# VISUAL
background_opacity 0.95
cursor_shape block
cursor #ec4df0
cursor_text_color #0b0113
cursor_blink_interval 0.5
cursor_stop_blinking_after 0
confirm_os_window_close 0
enable_audio_bell no
hide_window_decorations yes
mouse_hide_wait -1.0
enabled_layouts fat:bias=70;full_size=1;mirrored=false
cursor_trail 2
window_padding_width 0

# LATENCY
input_delay 2
repaint_delay 8
sync_to_monitor no
wayland_enable_ime no

# SCROLL
scrollback_lines 10000
scrollbar hovered
scrollbar_width 1.5

# FONT
font_size 11.0
text_composition_strategy legacy
modify_font underline_thickness 30%
modify_font cell_height -1px
box_drawing_scale 0.001, 1, 1.5, 2
font_family      Maple Mono NF Thin
bold_font        Maple Mono NF SemiBold
italic_font      Maple Mono NF Thin Italic
bold_italic_font Maple Mono NF SemiBold Italic

# BINDINGS
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab
map ctrl+shift+alt+t set_tab_title
map ctrl+t no_op
map ctrl+q no_op

# VARIOUS
shell_integration no-title no-cursor no-rc
allow_remote_control no 

