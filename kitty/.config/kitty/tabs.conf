# style chevron numéroté
tab_bar_style powerline
# {title} = nom manuel de l'onglet s'il a été renommé, sinon titre courant :
# la commande en cours (publiée en OSC 2 par prompt.zsh), puis le dossier.
tab_title_template "{index}:{title}   "
active_tab_font_style bold-italic

# position haute serrée
tab_bar_edge bottom
tab_bar_margin_width 0
tab_bar_margin_height 0.0 5.0

# barre d'onglets affichée dès 2 onglets.
# min_tabs 1 (barre visible aussi avec un seul onglet) faisait apparaître la
# barre dans l'écran de veille Omarchy, qui est un kitty plein écran à 1 onglet.
tab_bar_min_tabs 2

# affiche + pour ajouter un nouvel onglet
tab_bar_show_new_tab_button yes
