# style chevron numéroté
tab_bar_style powerline
tab_title_template "{index}   "
active_tab_font_style bold-italic

# position haute serrée
tab_bar_edge top
tab_bar_margin_width 0
tab_bar_margin_height 0.0 5.0

# affiche la barre d'onglets même si 1 seul ouvert
tab_bar_min_tabs 2

# affiche + pour ajouter un nouvel onglet
tab_bar_show_new_tab_button yes


# navigation
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+0 goto_tab 10
