shell = "zsh"

[templates]
defer = "{{ hooks?.pre | nl }}{% for file in files %}zsh-defer source \"{{ file }}\"\n{% endfor %}{{ hooks?.post | nl }}"
fpath = 'fpath=( "{{ dir }}" $fpath )'

[plugins]
# NOTE : grc est désormais sourcé dans _load_deferred (cf .zshrc), pas ici :
# ses 42 wrappers ne sont utiles qu'à la première commande tapée, et le source
# coûte ~4 ms sur le chemin critique (fork `tty -s` + construction du hash PATH).

# zsh-defer : indispensable, utilisé par .zshrc
[plugins.zsh-defer]
github = "romkatv/zsh-defer"

# ajout de commandes d'auto-completions
[plugins.zsh-completions]
github = "zsh-users/zsh-completions"
apply = ["fpath"]
dir = "src"

# ---------------------------------------------------------------------------
# Les plugins ci-dessous ne sont PLUS chargés par sheldon : .zshrc les source
# dans un unique `zsh-defer _load_deferred` (un seul rendu de prompt au lieu
# d'un par plugin). Ils restent déclarés ici pour que `sheldon lock --update`
# continue de les cloner et de les mettre à jour.
# `apply = []` = déclaré mais non sourcé par sheldon (chargé par _load_deferred).
# ---------------------------------------------------------------------------

# fzf-tab affiche l'autocompletion avec fzf
[plugins.fzf-tab]
apply = []
github = "Aloxaf/fzf-tab"

# suggestions automatiques grises au bout de la commande prétapée
[plugins.zsh-autosuggestions]
apply = []
github = "zsh-users/zsh-autosuggestions"

# remplace cd
[plugins.zsh-zoxide]
apply = []
github = "z-shell/zsh-zoxide"

# chargement alias & function perso
[plugins.aliases]
apply = []
local = "~/.config/zsh/sheldon/alias"
use = ["*"]

# zsh-patina, mise et oh-my-posh (inline) sont désormais initialisés par
# _cached_init dans .zshrc : cache versionné sur la mtime du binaire
# (~/.cache/zsh/initcache), au lieu de _evalcache qui fork md5 à chaque shell.
