shell = "zsh"

[templates]
defer = "{{ hooks?.pre | nl }}{% for file in files %}zsh-defer source \"{{ file }}\"\n{% endfor %}{{ hooks?.post | nl }}"
fpath = 'fpath=( "{{ dir }}" $fpath )'

[plugins]
# NOTE: grc is now sourced in _load_deferred (see .zshrc), not here:
# its 42 wrappers only matter from the first typed command, and sourcing
# costs ~4 ms on the critical path (fork `tty -s` + PATH hash build).

# zsh-defer: required, used by .zshrc
[plugins.zsh-defer]
github = "romkatv/zsh-defer"

# adds completion commands
[plugins.zsh-completions]
github = "zsh-users/zsh-completions"
apply = ["fpath"]
dir = "src"

# ---------------------------------------------------------------------------
# The plugins below are NO LONGER loaded by sheldon: .zshrc sources them
# in a single `zsh-defer _load_deferred` (one prompt render instead of
# one per plugin). They stay declared here so `sheldon lock --update`
# keeps cloning and updating them.
# `apply = []` = declared but not sourced by sheldon (loaded by _load_deferred).
# ---------------------------------------------------------------------------

# fzf-tab shows completions in fzf
[plugins.fzf-tab]
apply = []
github = "Aloxaf/fzf-tab"

# grey auto-suggestions after the pre-typed command
[plugins.zsh-autosuggestions]
apply = []
github = "zsh-users/zsh-autosuggestions"

# replaces cd
[plugins.zsh-zoxide]
apply = []
github = "z-shell/zsh-zoxide"

# loads custom aliases & functions
[plugins.aliases]
apply = []
local = "~/.config/zsh/sheldon/alias"
use = ["*"]

# zsh-patina, mise and oh-my-posh (inline) are now initialised by
# _cached_init in .zshrc: cache versioned on the binary's mtime
# (~/.cache/zsh/initcache), instead of _evalcache which forked md5 on every shell.
